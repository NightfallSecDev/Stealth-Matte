<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-height, initial-scale=1.0">
    <title>Secure Encrypted Checkout | Stealth Matte</title>
    <meta name="description" content="Complete your secure cybernetic hardware order with 256-bit encryption and premium insured shipping.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .checkout-grid {
            max-width: 1400px;
            margin: 4rem auto 8rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }

        .checkout-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .checkout-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 1.5rem;
        }

        .payment-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .payment-tab {
            flex-grow: 1;
            padding: 1rem;
            background: var(--bg-main);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .payment-tab.active {
            background: rgba(255, 87, 34, 0.15);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="brand">
                <span>STEALTH</span>
                <span class="brand-dot"></span>
                <span class="mono" style="font-size: 1rem; font-weight: 500; color: var(--text-muted);">// MATTE</span>
            </a>
            <ul class="nav-links">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="./shop.html" class="nav-link">Shop Catalog</a></li>
                <li><a href="./about.html" class="nav-link">About Us</a></li>
                <li><a href="./contact.html" class="nav-link">Contact</a></li>
                <li><a href="../admin/dashboard.html" class="nav-link">Command Center</a></li>
            </ul>
            <div class="nav-actions" style="display: flex; align-items: center; gap: 1rem;">
                <a href="./login.html" class="btn btn-secondary" id="navAuthBtn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">
                    <i class="fas fa-user-shield text-accent"></i> <span id="navAuthText">Operative Login</span>
                </a>
                <a href="./shop.html" class="btn btn-secondary" style="padding: 0.6rem 1.25rem;">
                    <i class="fas fa-arrow-left"></i> Back to Shop
                </a>
            </div>
        </div>
    </nav>

    <!-- Checkout Main -->
    <main class="checkout-grid">
        <!-- Left Column: Form -->
        <div class="checkout-panel">
            <h1 class="checkout-title"><i class="fas fa-shield-alt text-accent"></i> 256-Bit Encrypted Checkout</h1>
            
            <form id="checkoutForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="fullName" class="form-control" required placeholder="e.g. Alexander Wright">
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address (For Order Tracking & Keys)</label>
                    <input type="email" name="email" class="form-control" required placeholder="e.g. alex@wright.io">
                </div>
                <div class="form-group">
                    <label class="form-label">Shipping Address</label>
                    <input type="text" name="address" class="form-control" required placeholder="123 Cybernetic Way, Suite 400">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label">City</label>
                        <input type="text" name="city" class="form-control" required placeholder="Neo Arcadia">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Postal / Zip Code</label>
                        <input type="text" name="zip" class="form-control" required placeholder="94016">
                    </div>
                </div>

                <h2 class="checkout-title" style="margin-top: 3rem; font-size: 1.5rem;"><i class="fas fa-credit-card text-accent"></i> Payment Method</h2>
                
                <div class="payment-tabs">
                    <div class="payment-tab active" onclick="selectTab(this)"><i class="fas fa-credit-card"></i> Credit Card</div>
                    <div class="payment-tab" onclick="selectTab(this)"><i class="fab fa-apple"></i> Apple Pay</div>
                    <div class="payment-tab" onclick="selectTab(this)"><i class="fab fa-bitcoin"></i> Crypto</div>
                </div>

                <div id="cardFields">
                    <div class="form-group">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control mono" placeholder="4000 1234 5678 9010" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label class="form-label">Expiry Date</label>
                            <input type="text" class="form-control mono" placeholder="MM/YY" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">CVV / CVC</label>
                            <input type="password" class="form-control mono" placeholder="•••" required maxlength="4">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent" style="width: 100%; justify-content: center; padding: 1.25rem; font-size: 1.1rem; margin-top: 2rem;">
                    <i class="fas fa-lock"></i> Authorize & Place Order
                </button>
            </form>
        </div>

        <!-- Right Column: Order Summary -->
        <div class="checkout-panel" style="background: var(--bg-dark);">
            <h2 class="checkout-title" style="font-size: 1.5rem;"><i class="fas fa-box text-accent"></i> Order Summary</h2>
            
            <!-- Discount Code -->
            <div style="display: flex; gap: 0.75rem; margin-bottom: 2rem;">
                <input type="text" id="discountCode" class="form-control" placeholder="Promo Code (STEALTH20)">
                <button type="button" id="applyDiscountBtn" class="btn btn-secondary" style="padding: 0 1.5rem;">Apply</button>
            </div>

            <div id="checkoutOrderSummary">
                <!-- Dynamically rendered by store.js -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom" style="border-top: none; padding-top: 0;">
            <div>&copy; 2026 Stealth Matte Inc. All cybernetic rights reserved.</div>
            <div class="mono" style="color: var(--accent);">// SECURE 256-BIT ENCRYPTED</div>
        </div>
    </footer>

    <script src="../js/store.js"></script>
    <script>
        function selectTab(el) {
            document.querySelectorAll('.payment-tab').forEach(tab => tab.classList.remove('active'));
            el.classList.add('active');
            const cardFields = document.getElementById('cardFields');
            if (el.textContent.includes('Credit Card')) {
                cardFields.style.display = 'block';
                cardFields.querySelectorAll('input').forEach(i => i.required = true);
            } else {
                cardFields.style.display = 'none';
                cardFields.querySelectorAll('input').forEach(i => i.required = false);
            }
        }
    </script>
</body>
</html>
